name: E2E (admin panel)

# Runs the OpenAdmin Playwright suite against the shared test server on every
# build (push to main) and on demand (workflow_dispatch). It builds the admin
# binary from this commit, ships it to the test box, restarts the admin
# service, then runs the suite from the runner over the network. A failing run
# opens/updates a single persistent issue on this repo (if issues are enabled).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mutating:
        description: "Run mutating tests too (changes state on the box)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # one E2E run against the shared box at a time, newer push wins
  group: e2e-admin-shared-box
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
      - name: Build amd64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -buildvcs=false -trimpath -buildmode=pie -ldflags="-s -w" -o openadmin-amd64 ./cmd/openadmin
      - uses: actions/upload-artifact@v4
        with:
          name: openadmin-amd64
          path: openadmin-amd64

  deploy-and-test:
    needs: build
    runs-on: ubuntu-latest
    # up to 3h waiting for the box lock plus ~90m suite, cap so a hung spec still dies
    timeout-minutes: 330
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: stefanpejcic/openpanel-tests
          path: tests

      - uses: actions/download-artifact@v4
        with:
          name: openadmin-amd64

      - name: Setup SSH to test box
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TEST_SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          # retry, one slow connect shouldn't kill the whole run
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -H "${{ secrets.TEST_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && exit 0
            echo "keyscan attempt $i failed, retrying..."; sleep 10
          done
          echo "could not reach the test box over ssh"; exit 1

      - name: Acquire exclusive box lock
        # admin (this repo) and the user-panel suite (OpenPanel repo) share one
        # box; GitHub concurrency can't span repos, so serialize via a lock on it
        # kept in /root since /tmp and /var/lock are wiped by the reboot spec
        run: |
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" '
            for i in $(seq 1 720); do
              if mkdir /root/.e2e-box.lock 2>/dev/null; then
                echo "${{ github.repository }}#${{ github.run_id }}" > /root/.e2e-box.lock/owner
                echo "lock acquired"; exit 0
              fi
              if [ -d /root/.e2e-box.lock ] && [ $(( $(date +%s) - $(stat -c %Y /root/.e2e-box.lock) )) -gt 9600 ]; then
                echo "breaking stale lock held by $(cat /root/.e2e-box.lock/owner 2>/dev/null)"; rm -rf /root/.e2e-box.lock
              fi
              echo "box busy (held by $(cat /root/.e2e-box.lock/owner 2>/dev/null)), waiting..."; sleep 15
            done
            echo "could not acquire box lock in time"; exit 1
          '

      - name: Deploy this build to the test box
        run: |
          # mirrors opencli update --admin: binary lives at /usr/local/admin/openadmin-amd64, service is `admin`
          chmod +x openadmin-amd64
          scp -i ~/.ssh/id openadmin-amd64 "root@${{ secrets.TEST_SSH_HOST }}:/usr/local/admin/openadmin-amd64.new"
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" '
            set -e
            chmod +x /usr/local/admin/openadmin-amd64.new
            mv -f /usr/local/admin/openadmin-amd64.new /usr/local/admin/openadmin-amd64
            systemctl restart admin
            for i in $(seq 1 30); do
              systemctl is-active --quiet admin && curl -ksf https://127.0.0.1:2087/login >/dev/null && exit 0
              sleep 2
            done
            echo "admin service did not come healthy" >&2
            systemctl status admin --no-pager | tail -20 >&2
            exit 1
          '

      # modules and the test account the suite expects, whatever an earlier run left behind
      - name: Reset the test box baseline
        run: |
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" "bash -s" < tests/openpanel/e2e-baseline.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: tests
        run: |
          # mirrors INSTALL.sh: the tests repo ships no package.json, deps are installed fresh
          npm init -y >/dev/null 2>&1 || true
          npm install --yes @playwright/test dotenv basic-ftp otplib
          npx --yes playwright install --with-deps chromium

      - name: Write .env
        working-directory: tests
        run: |
          cat > openadmin/.env <<EOF
          BASE_URL=${{ secrets.ADMIN_BASE_URL }}
          PANEL_USERNAME=${{ secrets.ADMIN_USERNAME }}
          PANEL_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          RUN_MUTATING=${{ inputs.run_mutating && '1' || '' }}
          EOF

      - name: Run admin suite
        working-directory: tests
        env:
          # suite wall clock (ms); normal is ~90m, abort at 140m so a stuck spec exits cleanly with reports instead of hitting the job cap
          PW_GLOBAL_TIMEOUT: "8400000"
        run: ./openadmin/run-tests.sh || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-admin
          path: |
            tests/logs/html-report-*
            tests/logs/*.json
            tests/logs/*.log
          if-no-files-found: ignore

      - name: Release box lock
        if: always()
        run: |
          ssh -i ~/.ssh/id "root@${{ secrets.TEST_SSH_HOST }}" 'rm -rf /root/.e2e-box.lock; echo "lock released"' || true

      # pass/fail counts and every failed test with its first error line, for the Job Summary and the issue
      - name: Test report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let md = '';
            try {
              const dir = 'tests/logs';
              const file = fs.readdirSync(dir).find(f => f.endsWith('-latest.json'));
              const data = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const st = data.stats || {};
              const esc = s => String(s).replace(/\|/g, '\\|');
              const rows = [];
              const walk = suite => {
                for (const spec of suite.specs || []) for (const t of spec.tests || []) {
                  if (t.status !== 'unexpected') continue;
                  const r = (t.results || [])[t.results.length - 1] || {};
                  const err = ((r.error || {}).message || '').replace(/\x1b\[[0-9;]*m/g, '').split('\n')[0].slice(0, 160);
                  rows.push(`| \`${esc(spec.file.replace(/^tests\//, ''))}\` | ${esc(spec.title)} | ${esc(err)} |`);
                }
                for (const c of suite.suites || []) walk(c);
              };
              for (const s of data.suites || []) walk(s);
              md += `**${st.expected || 0} passed, ${st.unexpected || 0} failed, ${st.flaky || 0} flaky**, ${st.skipped || 0} skipped or not run.\n\n`;
              if ((st.duration || 0) >= 8400000 - 60000) md += `The run hit the suite time limit, the tests after that point never ran.\n\n`;
              if (rows.length) {
                md += `<details><summary>${rows.length} failed tests</summary>\n\n| spec | test | first error line |\n|---|---|---|\n`;
                md += rows.slice(0, 150).join('\n') + (rows.length > 150 ? `\n| ... | ${rows.length - 150} more | see the artifact |` : '') + '\n\n</details>\n';
              }
            } catch (e) {
              md = `No results file to summarize (${e.message}), see the run log.\n`;
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'e2e-report.md'), md);
            await core.summary.addRaw(md).write();

      - name: Open/update issue on failure
        if: always() && env.TESTS_FAILED == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'E2E: admin panel suite failing';
            const body = [
              `The admin E2E suite failed on commit ${context.sha.slice(0,7)}.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              require('fs').existsSync(`${process.env.RUNNER_TEMP}/e2e-report.md`) ? require('fs').readFileSync(`${process.env.RUNNER_TEMP}/e2e-report.md`, 'utf8') : '',
            ].join('\n');
            try {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'e2e-failure', per_page: 100,
              });
              const hit = existing.data.find(i => i.title === title);
              if (hit) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['e2e-failure'] });
              }
            } catch (e) {
              core.warning(`could not file an issue (are issues enabled on this repo?): ${e.message}`);
            }

      - name: Fail the job if tests failed
        if: always() && env.TESTS_FAILED == '1'
        run: exit 1
