<div style="background:#f5f5f5;padding:1.5rem;border-radius:8px;">
  <div style="background:#fff;border-radius:8px;border:1px solid #eee;overflow:hidden;max-width:600px;margin:0 auto;">
    <div style="height:5px;background:#de3618;"></div>
    <div style="padding:32px 36px 24px;">
      <strong style="font-size:17px;">{{.Title}}</strong>
      <p style="font-size:15px;line-height:1.7;color:#444;white-space:pre-wrap;">{{.Message}}</p>
    </div>
    <div style="padding:0 36px 28px;">
      <a href="{{.NotificationsURL}}" style="display:inline-block;font-size:14px;font-weight:500;border:1px solid #ccc;border-radius:6px;padding:10px 22px;text-decoration:none;">Edit Notification Preferences</a>
    </div>
    <div style="background:#f5f5f5;padding:16px 36px;font-size:13px;color:#666;">
      Server: {{.Hostname}}
    </div>
  </div>
</div>
