<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-900 dark:text-gray-50 min-h-[90vh]">
        {{template "chrome_flashes" .}}

<div>
    <div x-data="{ showSection: false }" class="op-page-header border-b border-gray-200 p-4 dark:border-gray-800 sm:p-6 lg:p-8">
        <header>
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <div class="grow">
                    <h1 class="mb-1 text-lg font-semibold text-gray-900 dark:text-gray-50">Rename Reseller: {{.Username}}</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-500">Change the username of this reseller.</p>
                </div>
                <div class="flex flex-none items-center gap-2">

                </div>
            </div>
    </header>
    </div>


<div id="collapseAddNewUser" class="px-4 py-6 sm:px-6 lg:px-8">
    <div class="max-w-2xl" style="display:block;">
        <form method="POST" action="/resellers">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <input type="hidden" name="action" value="rename_user">
            <input type="hidden" name="username" value="{{.Username}}">

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-6">
                <div class="col-span-full">
                    <label class="block text-sm font-medium leading-none text-gray-900 dark:text-gray-50" for="username">Current username</label>
                    <div class="relative w-full mt-2">
                        <input
                            type="text"
                            class="block rounded-md border border-gray-300 bg-white text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 dark:aria-[invalid=true]:border-red-700 dark:aria-[invalid=true]:ring-red-700/30 w-full appearance-none px-2.5 py-2 text-sm" disabled  readonly name="username" id="username" value="{{.Username}}"
                        />
                    </div>
                </div>

                <div class="col-span-full">
                    <label class="block text-sm font-medium leading-none text-gray-900 dark:text-gray-50" for="new_username">New username <span class="text-red-600 dark:text-red-500" aria-hidden="true">*</span></label>
                    <div class="relative w-full mt-2">
                        <input
                            type="text"
                            class="block rounded-md border border-gray-300 bg-white text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 dark:aria-[invalid=true]:border-red-700 dark:aria-[invalid=true]:ring-red-700/30 w-full appearance-none px-2.5 py-2 text-sm" min="5" max="16" name="new_username" id="new_username" pattern="[a-zA-Z0-9]{5,16}" title="Can only contain letters and numbers. 5 characters min. - 16 max." required="" autofocus value="{{.Username}}"
                        />
                    </div>
                </div>


            </div>

            <div class="mt-6 flex flex-col-reverse gap-2 border-t border-gray-200 pt-6 sm:flex-row sm:justify-end dark:border-gray-800">
                <a href="/resellers" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border text-center font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 px-3 py-2 text-sm border-gray-300 bg-white text-gray-900 shadow-xs hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">Go back</a>
                <button type="submit" class="relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border text-center font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 px-3 py-2 text-sm border-transparent bg-blue-500 text-white shadow-xs hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400">Change username</button>
            </div>
        </form>
    </div>
</div>


</div>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
