<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-900 dark:text-gray-50 min-h-[90vh] p-0">
        {{template "chrome_flashes" .}}
{{if .ForUser}}<div class="flex items-center gap-3 border-b border-gray-200 px-4 py-2 text-sm dark:border-gray-800"><a href="/security/imunify/" class="text-blue-500 hover:underline hover:underline-offset-4">&larr; All users</a><span class="text-gray-500 dark:text-gray-500">ImunifyAV for <b class="text-gray-900 dark:text-gray-50">{{.ForUser}}</b></span></div>{{end}}

<iframe class="stream-element block w-full border-0" name="myiframe" id="myiframe" src="/imav/{{if .Token}}#/login?token={{.Token}}{{end}}" title="ImunifyAV" style="height: calc(100svh - 4rem);"></iframe>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
