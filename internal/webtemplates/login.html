  <link rel="icon" href="/static/images/favicon.svg" type="image/x-icon" />
  <meta name="csrf-token" content="{{.CSRFToken}}">

  <link rel="stylesheet" href="{{asset "/static/dist/output.css"}}">

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <!-- dark mode follows the saved theme, or the device setting if none is saved, same as the panel pages -->
  <script>if(localStorage.getItem('color-theme')==='dark'||(!('color-theme' in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}</script>
  <style>html.dark body{background-image:none!important}</style>
</head>

        <div>
          <p class="text-sm font-semibold text-gray-900 dark:text-gray-50">{{if .ForceDomainValue}}{{.ForceDomainValue}}{{else if .ServerHostname}}{{.ServerHostname}}{{else}}{{.PublicIP}}{{end}}</p>
          <p class="text-xs text-gray-500 dark:text-gray-500"><a href="https://openpanel.com/{{if eq .LicenseType "Enterprise"}}enterprise/{{end}}?utm_src=version_admin_login_page" target="_blank" class="rounded hover:underline hover:underline-offset-4 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2">OpenAdmin {{.PanelVersion}} &middot; {{.LicenseType}}</a></p>
        </div>
      </div>
    <div class="rounded-md border border-gray-200 bg-white p-6 shadow-xs dark:border-gray-900 dark:bg-raised">
      <div>
        <h1 class="text-center text-lg font-semibold text-gray-900 dark:text-gray-50">Sign in</h1>

        <form @submit="handleSubmit" class="mt-6 space-y-4" action="/login?next={{.Next}}" method="POST">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />

          <div>
            <label class="block text-sm font-medium leading-none text-gray-900 dark:text-gray-50" for="username">Username</label>
            <div class="relative w-full mt-2">
              <input type="text" class="block rounded-md border border-gray-300 bg-white text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 dark:aria-[invalid=true]:border-red-700 dark:aria-[invalid=true]:ring-red-700/30 w-full appearance-none px-2.5 py-2 text-sm" name="username" id="username" autocomplete="username" required autofocus/>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium leading-none text-gray-900 dark:text-gray-50" for="password">Password</label>
            <div class="relative w-full mt-2">
              <input :type="showPassword ? 'text' : 'password'" name="password"
 class="block rounded-md border border-gray-300 bg-white text-gray-900 shadow-xs outline-hidden transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 aria-[invalid=true]:border-red-500 aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-red-200 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:placeholder:text-gray-500 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 dark:aria-[invalid=true]:border-red-700 dark:aria-[invalid=true]:ring-red-700/30 w-full appearance-none px-2.5 py-2 text-sm pr-10" id="password" autocomplete="current-password"/>
              <div class="absolute inset-y-0 right-1 flex items-center">
                <button :aria-label="showPassword ? 'Hide password' : 'Show password'" :aria-pressed="showPassword.toString()" class="inline-flex shrink-0 items-center justify-center rounded-md text-gray-500 transition hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800/80 dark:hover:text-gray-50 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 size-8" type="button" @click="showPassword = !showPassword"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" aria-hidden="true" class="remixicon size-4"><path d="M1.18164 12C2.12215 6.87976 6.60812 3 12.0003 3C17.3924 3 21.8784 6.87976 22.8189 12C21.8784 17.1202 17.3924 21 12.0003 21C6.60812 21 2.12215 17.1202 1.18164 12ZM12.0003 17C14.7617 17 17.0003 14.7614 17.0003 12C17.0003 9.23858 14.7617 7 12.0003 7C9.23884 7 7.00026 9.23858 7.00026 12C7.00026 14.7614 9.23884 17 12.0003 17ZM12.0003 15C10.3434 15 9.00026 13.6569 9.00026 12C9.00026 10.3431 10.3434 9 12.0003 9C13.6571 9 15.0003 10.3431 15.0003 12C15.0003 13.6569 13.6571 15 12.0003 15Z"></path></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <span class="relative flex"><input x-model="rememberMe" id="rememberme" type="checkbox" class="peer size-4 shrink-0 cursor-pointer appearance-none rounded border border-gray-300 bg-white shadow-xs transition checked:border-blue-500 checked:bg-blue-500 indeterminate:border-blue-500 indeterminate:bg-blue-500 disabled:cursor-not-allowed disabled:bg-gray-100 dark:border-gray-800 dark:bg-gray-950 dark:checked:border-blue-500 dark:checked:bg-blue-500 dark:indeterminate:border-blue-500 dark:indeterminate:bg-blue-500 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2"/><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="pointer-events-none absolute inset-0 hidden size-4 p-0.5 text-white peer-checked:block"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg></span>
            <label for="rememberme" class="text-sm text-gray-900 dark:text-gray-50">Remember me on this device</label>
          </div>

          <button class="w-full relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border text-center font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 px-3 py-2 text-sm border-transparent bg-blue-500 text-white shadow-xs hover:bg-blue-600 disabled:bg-blue-300 dark:disabled:bg-blue-800 dark:disabled:text-blue-400" type="submit">Sign in</button>
      </form>


        {{if .Flashes}}
        <div class="mx-auto my-6 text-center">
          {{range .Flashes}}
          <p class="mt-3 text-sm {{if eq .Category "success"}}text-emerald-600 dark:text-emerald-500{{else}}text-red-600 dark:text-red-500{{end}}">
            {{.Message}}
          </p>
          {{end}}
        </div>
        {{end}}
        <div class="my-5 flex items-center gap-3 text-xs text-gray-500 dark:text-gray-500"><span class="h-px flex-1 bg-gray-200 dark:bg-gray-800"></span>or<span class="h-px flex-1 bg-gray-200 dark:bg-gray-800"></span></div>
        <div class="space-y-2">
        <button id="passkey-login-btn" type="button" class="w-full hidden relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border text-center font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 px-3 py-2 text-sm border-gray-300 bg-white text-gray-900 shadow-xs hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600">Sign in with a passkey</button>
        <p id="passkey-login-error" role="alert" class="mt-2 hidden text-center text-sm text-red-600 dark:text-red-500"></p>
        <a href="{{if .OpenpanelDomain}}https://{{.OpenpanelDomain}}{{else if .ForceDomainValue}}https://{{.ForceDomainValue}}{{else}}http://{{.PublicIP}}{{end}}:{{.OpenpanelPort}}" class="w-full relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border text-center font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 px-3 py-2 text-sm border-gray-300 bg-white text-gray-900 shadow-xs hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600"><svg aria-hidden="true" version="1.0" class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213.000000 215.000000" preserveAspectRatio="xMidYMid meet"><g transform="translate(0.000000,215.000000) scale(0.100000,-0.100000)" fill="currentColor" stroke="none"><path d="M990 2071 c-39 -13 -141 -66 -248 -129 -53 -32 -176 -103 -272 -158 -206 -117 -276 -177 -306 -264 -17 -50 -19 -88 -19 -460 0 -476 0 -474 94 -568 55 -56 124 -98 604 -369 169 -95 256 -104 384 -37 104 54 532 303 608 353 76 50 126 113 147 184 8 30 12 160 12 447 0 395 -1 406 -22 461 -34 85 -98 138 -317 264 -104 59 -237 136 -295 170 -153 90 -194 107 -275 111 -38 2 -81 0 -95 -5z m205 -561 c66 -38 166 -95 223 -127 l102 -58 0 -262 c0 -262 0 -263 -22 -276 -13 -8 -52 -31 -88 -51 -36 -21 -126 -72 -200 -115 l-135 -78 -3 261 -3 261 -166 95 c-91 52 -190 109 -219 125 -30 17 -52 34 -51 39 3 9 424 256 437 255 3 0 59 -31 125 -69z"></path></g>
          </svg>
          Switch to OpenPanel
        </a>
        </div>
      </div>
    </div>
    <p class="mt-6 text-center text-xs text-gray-500 dark:text-gray-500">
      <a href="https://openpanel.com/?utm_src=copyright_openadmin_login_page" target="_blank" class="rounded hover:underline hover:underline-offset-4 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2" x-data="{ year: new Date().getFullYear() }">© <span x-text="year">2026</span> OpenPanel, LLC</a>
    </p>
    </div>
  </div>
</body>

<script>
  function loginForm() {
    return {
      rememberMe: false,

      init() {
        const savedUsername = localStorage.getItem("rememberedUsername");
        if (savedUsername) {
          document.getElementById("username").value = savedUsername;
          this.rememberMe = true;
        }
      },

      handleSubmit(event) {
        const username = document.getElementById("username").value;

        if (this.rememberMe && username) {
          localStorage.setItem("rememberedUsername", username);
        } else {
          localStorage.removeItem("rememberedUsername");
        }
      },
    };
  }

  function base64urlToBuffer(base64url) {
    const padded = base64url.replace(/-/g, '+').replace(/_/g, '/').padEnd(base64url.length + (4 - base64url.length % 4) % 4, '=');
    const binary = atob(padded);
    const buffer = new ArrayBuffer(binary.length);
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return buffer;
  }

  function bufferToBase64url(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  document.addEventListener('DOMContentLoaded', function () {
    const passkeyBtn = document.getElementById('passkey-login-btn');
    const errorEl = document.getElementById('passkey-login-error');
    const csrf = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    if (!window.PublicKeyCredential) {
      return;
    }
    passkeyBtn.classList.remove('hidden');

    passkeyBtn.addEventListener('click', async function () {
      errorEl.classList.add('hidden');
      try {
        const beginRes = await fetch('/login/passkey/begin', {
          method: 'POST',
          headers: { 'X-CSRFToken': csrf },
        });
        if (!beginRes.ok) throw new Error('Could not start passkey login.');
        const options = await beginRes.json();

        options.challenge = base64urlToBuffer(options.challenge);
        if (options.allowCredentials) {
          options.allowCredentials.forEach(c => c.id = base64urlToBuffer(c.id));
        }

        const assertion = await navigator.credentials.get({ publicKey: options });

        const credentialJson = {
          id: assertion.id,
          rawId: bufferToBase64url(assertion.rawId),
          type: assertion.type,
          response: {
            clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
            authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
            signature: bufferToBase64url(assertion.response.signature),
            userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null,
          },
        };

        const params = new URLSearchParams(window.location.search);
        const nextParam = params.get('next') ? ('?next=' + encodeURIComponent(params.get('next'))) : '';

        const completeRes = await fetch('/login/passkey/complete' + nextParam, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
          body: JSON.stringify(credentialJson),
        });
        const result = await completeRes.json();
        if (!completeRes.ok || !result.redirect) throw new Error(result.error || 'Passkey login failed.');

        window.location.href = result.redirect;
      } catch (err) {
        errorEl.textContent = err.message || 'Passkey login failed.';
        errorEl.classList.remove('hidden');
      }
    });
  });
</script>
</html>
