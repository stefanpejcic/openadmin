<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-800 dark:text-white min-h-[90vh]">
        {{template "chrome_flashes" .}}

<div class="flex min-h-[70vh] flex-col items-center justify-center px-4 text-center">
    <span class="flex size-10 items-center justify-center rounded-md bg-white shadow-xs ring-1 ring-gray-200 dark:bg-gray-900 dark:ring-gray-800"><svg class="size-5 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2h.01"/></svg></span>
    <h2 class="mt-4 text-sm font-semibold text-gray-900 dark:text-gray-50">Something went wrong</h2>
    <p class="mt-1 max-w-md text-sm text-gray-500 dark:text-gray-500">{{.Message}}</p>
</div>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
