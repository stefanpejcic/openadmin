<div style="background:#f5f5f5;padding:1.5rem;border-radius:8px;">
  <div style="background:#fff;border:1px solid #eaeaea;border-radius:5px;margin:0 auto;max-width:600px;padding:40px;">
    <h1 style="color:#111;font-size:22px;font-weight:normal;">{{.Title}}</h1>
    {{if .Items}}
    {{range .Items}}
    <div style="border-left:4px solid {{.Color}};background:#fafafa;padding:10px 14px;margin:0 0 16px;">
      <p style="margin:0 0 4px;color:{{.Color}};font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">{{.Label}}</p>
      <p style="margin:0 0 6px;color:#111;font-size:15px;font-weight:600;">{{.Title}}</p>
      <pre style="white-space:pre-wrap;color:#333;font-size:13px;line-height:20px;font-family:inherit;margin:0;">{{.Message}}</pre>
    </div>
    {{end}}
    {{else}}
    <pre style="white-space:pre-wrap;color:#111;font-size:14px;line-height:24px;font-family:inherit;">{{.Message}}</pre>
    {{end}}
    <div style="text-align:center;margin:24px 0;">
      <a href="{{.AdminURL}}notifications" style="background:#000;border-radius:5px;color:#fff;display:inline-block;font-size:12px;font-weight:500;line-height:50px;text-align:center;text-decoration:none;width:200px;">See More Details</a>
    </div>
    <hr style="border:none;border-top:1px solid #eaeaea;margin:26px 0;">
    <p style="color:#666;font-size:12px;">Sentinel Monitoring service running on OpenPanel server: <strong>{{.Hostname}}</strong></p>
  </div>
</div>
