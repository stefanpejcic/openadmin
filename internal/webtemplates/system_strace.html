<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-900 dark:text-gray-50 min-h-[90vh]">
        {{template "chrome_flashes" .}}

<div x-data="{ searchQuery: '', filters: { active: false, suspended: false } }">
    <div x-data="{ showSection: false, fileContent: '' }" class="op-page-header border-b border-gray-200 p-4 dark:border-gray-800 sm:p-6 lg:p-8">
        <header>
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <div class="grow">
                    <h1 class="mb-1 text-lg font-semibold text-gray-900 dark:text-gray-50">Process manager</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-500">strace -p <code class="rounded bg-gray-100 px-1.5 py-0.5 font-mono text-[0.8125em] text-gray-900 dark:bg-gray-800 dark:text-gray-50">{{.PID}}</code></p>
                </div>
                <div class="flex flex-none items-center gap-2 sm:justify-end">
                    <button type="button" onclick="controller.abort()" class="hidden relative inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border text-center font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none disabled:shadow-none outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 px-2.5 py-1.5 text-xs border-transparent bg-red-600 text-white shadow-xs hover:bg-red-700 disabled:bg-red-300 dark:bg-red-700 dark:hover:bg-red-600 dark:disabled:bg-red-950 dark:disabled:text-red-400">Stop tracing</button>
                </div>
            </div>
        </header>
    </div>

    <div class="px-4 py-6 sm:px-6 lg:px-8">
        <div class="space-y-3">
            <pre aria-label="strace output" class="relative overflow-auto whitespace-pre-wrap rounded-md bg-gray-950 p-4 text-left font-mono text-xs leading-5 text-gray-200 ring-1 ring-gray-800 max-h-[70vh] min-h-48" id="stream">

            </pre>
        </div>
    </div>
</div>




<script>
document.addEventListener("DOMContentLoaded", () => {
    const streamEl = document.getElementById('stream');
    const pid = "{{.PID}}";

    const eventSource = new EventSource(`/server/processes/${pid}/strace?output=stream`);
    let controller = new AbortController();

    fetch(`/server/processes/${pid}/strace?output=stream`, { signal: controller.signal })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    streamEl.textContent += `[strace error] ${text}`;
                });
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            function readChunk() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        console.log("Stream complete");
                        return;
                    }

                    const text = decoder.decode(value);
                    streamEl.textContent += text;
                    streamEl.scrollTop = streamEl.scrollHeight;

                    readChunk();
                });
            }

            readChunk();
        })
        .catch(err => {
            streamEl.textContent += "\n[Error fetching strace stream]";
            console.error(err);
        });
});
</script>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
