<!DOCTYPE html>
<html lang="en" style="color-scheme: ">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{if .ForceDomainValue}}{{.ForceDomainValue}}{{else if .ServerHostname}}{{.ServerHostname}}{{else}}{{.PublicIP}}{{end}} - Two-Factor Authentication for OpenAdmin</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/x-icon" />

  <link rel="stylesheet" href="{{asset "/static/dist/output.css"}}">

  <!-- same dark mode handling as login.html -->
  <script>if(localStorage.getItem('color-theme')==='dark'||(!('color-theme' in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}</script>
  <style>html.dark body{background-image:none!important}</style>
</head>
<body class="min-h-screen bg-gray-50 bg-contain bg-left bg-no-repeat font-sans text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-50" style="background-image: url('/static/images/login_background.png'); font-family: ui-sans-serif, system-ui, sans-serif;">
  <div class="flex min-h-screen flex-1 flex-col justify-center px-4 lg:px-6">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <div class="">
        <div class="flex items-center" style="gap: .625rem;">
          <p class="font-medium text-gray-900 dark:text-gray-50">OpenAdmin</p>
        </div>
      </div>
    </div>
    <div class="relative w-full rounded-md border p-6 text-left shadow-xs border-gray-200 bg-white dark:border-gray-900 dark:bg-raised mt-8 sm:mx-auto sm:w-full sm:max-w-md">
      <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <h3 class="text-center text-lg font-semibold text-gray-900 dark:text-gray-50">Two-Factor Authentication</h3>
        <p class="mt-2 text-center text-sm text-gray-500">Enter the 6-digit code from your authenticator app for <strong>{{.Username}}</strong>.</p>

        <form class="mt-6 space-y-4" method="POST">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />

          <div>
            <label class="text-sm leading-none font-medium text-gray-900 dark:text-gray-50" for="code">Authentication code</label>
            <div class="relative w-full mt-2">
              <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" class="relative block w-full appearance-none rounded-md border px-2.5 py-2 shadow-xs outline-none transition sm:text-sm border-gray-300 text-gray-900 placeholder-gray-400 bg-white text-center font-mono tracking-[0.4em] focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:focus:border-blue-700 dark:focus:ring-blue-700/30 outline-hidden dark:bg-gray-950 dark:border-gray-800 dark:text-gray-50" name="code" id="code" placeholder="000000" required autofocus/>
            </div>
          </div>

          <button class="relative inline-flex items-center justify-center whitespace-nowrap rounded-md border px-3 py-2 text-center text-sm font-medium shadow-xs transition-all duration-100 ease-in-out border-transparent bg-blue-500 text-white hover:bg-blue-600 dark:bg-blue-500 dark:hover:bg-blue-600 outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2 mt-4 w-full" type="submit">Verify</button>
        </form>

        {{if .Flashes}}
        <div class="mx-auto my-6 text-center">
          {{range .Flashes}}
          <p class="mt-3 text-sm {{if eq .Category "success"}}text-emerald-600 dark:text-emerald-500{{else}}text-red-600 dark:text-red-500{{end}}">
            {{.Message}}
          </p>
          {{end}}
        </div>
        {{end}}

        <div class="mx-auto my-6 text-center text-sm">
          <a href="/login" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
