<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-800 dark:text-white min-h-[90vh]">
        {{template "chrome_flashes" .}}

<form method="POST" id="ServicesJson">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

<div x-data="{ searchQuery: '' }">
    <div x-data="{ showSection: false }" class="op-page-header border-b border-gray-200 p-4 dark:border-gray-800 sm:p-6 lg:p-8">
        <header>
            <div class="flex flex-col gap-2 text-center sm:flex-row sm:items-center sm:justify-between sm:text-start">
                <div class="grow">
                    <h1 class="mb-1 text-lg font-semibold text-gray-900 dark:text-gray-50">Edit Services</h1>
                    <h2 class="text-sm text-gray-500 dark:text-gray-500">Set system services and containers manageable from the services page.</h2>
                </div>
                <div class="flex flex-none items-center justify-center gap-2 rounded-sm px-2 sm:justify-end sm:bg-transparent sm:px-0">
                    <a href="/services" class="relative inline-flex items-center justify-center border px-3 py-2 text-center text-sm font-medium transition-all duration-100 ease-in-out cursor-pointer sm:w-fit sm:mt-0 rounded-md border-gray-300 bg-white text-gray-900 hover:bg-gray-50 disabled:text-gray-400 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-50 dark:hover:bg-gray-900/60 dark:disabled:text-gray-600 shadow-xs outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2">Go back</a>
                    <button class="relative inline-flex items-center justify-center whitespace-nowrap border px-3 py-2 text-center text-sm font-medium transition-all duration-100 ease-in-out disabled:pointer-events-none rounded-md border-transparent bg-blue-500 text-white hover:bg-blue-600 disabled:bg-blue-300 disabled:text-white dark:border-transparent dark:bg-blue-500 dark:text-white dark:hover:bg-blue-600 dark:disabled:bg-blue-800 dark:disabled:text-blue-400 shadow-xs outline outline-0 outline-offset-2 outline-blue-500 focus-visible:outline-2" type="submit">Save</button>
                </div>
            </div>
        </header>
    </div>

  <div class="m-8">
      <textarea name="data" class="flex min-h-[4rem] w-full rounded-md border shadow-xs outline-none transition-colors text-gray-900 dark:text-gray-50 border-gray-300 dark:border-gray-800 bg-white dark:bg-gray-950 placeholder-gray-400 dark:placeholder-gray-500 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-300 disabled:dark:border-gray-700 disabled:dark:bg-gray-800 disabled:dark:text-gray-500 focus:ring-2 focus:ring-blue-200 focus:dark:ring-blue-700/30 focus:border-blue-500 focus:dark:border-blue-700 p-3 font-mono text-xs leading-5 whitespace-pre [tab-size:4]" rows="30" cols="50" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off">{{.Data}}</textarea>
    </div>


</div>
</form>


<script>
document.getElementById("ServicesJson").addEventListener("submit", function (e) {
    const textarea = this.querySelector("textarea[name='data']");
    const jsonData = textarea.value.trim();

    try {
        JSON.parse(jsonData);
    } catch (error) {
        e.preventDefault();
        showToast(`Invalid JSON:\n" + ${error.message}`, 'error');
        return;
    }

});
</script>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
