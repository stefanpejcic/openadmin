<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-800 dark:text-white min-h-[90vh]">
        {{template "chrome_flashes" .}}

<div class="flex min-h-[70vh] flex-col items-center justify-center px-4 text-center">
    <h1 id="error-link-container" class="text-3xl font-semibold tabular-nums text-gray-900 dark:text-gray-50">
      {{if .ErrorCode}}
        <span id="error-code" data-code="{{.ErrorCode}}">{{.ErrorCode}}</span>
      {{else}}
        Error
      {{end}}
    </h1>
    <p class="mt-2 max-w-md text-sm text-gray-500 dark:text-gray-500">{{.ErrorMessage}}</p>
</div>


<script>
  (function() {
    const errorCodeElement = document.getElementById('error-code');
    if (!errorCodeElement) return; // no error code to process

    const errorCode = errorCodeElement.getAttribute('data-code');

    const links = [
      { url: `https://http.dog/${errorCode}`, label: 'dog 🐶' },
      { url: `https://http.cat/${errorCode}`, label: 'cat 😺' },
      { url: `https://httpgoats.com/${errorCode}`, label: 'goat 🐐' },
      { url: `https://www.agiliq.com/notebook/http-status-memes/?code=/${errorCode}`, label: 'meme 🤡' }
    ];

    // pick a random link
    const randomIndex = Math.floor(Math.random() * links.length);
    const selected = links[randomIndex];

    // create an <a> element
    const linkElement = document.createElement('a');
    linkElement.href = selected.url;
    linkElement.target = '_blank';
    linkElement.rel = 'noopener noreferrer';
    linkElement.className = 'hover:underline hover:underline-offset-4';
    linkElement.textContent = `${errorCode}`;
    linkElement.title = `Click to view a ${selected.label}`;

    // replace the span with the link
    errorCodeElement.innerHTML = ''; // clear
    errorCodeElement.appendChild(linkElement);
  })();
</script>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
