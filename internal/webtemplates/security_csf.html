<!doctype html>
<html lang="en" class="h-full" style="color-scheme: ">
{{template "chrome_head" .}}
<body class="bg-white h-full antialiased dark:bg-gray-950">

<div class="flex min-h-svh w-full">
    {{template "chrome_sidebar" .}}
    <div class="w-full overflow-hidden">
        {{template "chrome_topbar" .}}

    <main id="no_margin_for_iframe" class="bg-white antialiased dark:bg-gray-950 text-gray-900 dark:text-gray-50 min-h-[90vh] p-0">
        {{template "chrome_flashes" .}}

<div class="op-page-header border-b border-gray-200 p-4 dark:border-gray-800 sm:p-6 lg:p-8">
    <h1 class="mb-1 text-lg font-semibold text-gray-900 dark:text-gray-50">Firewall</h1>
    <p class="text-sm text-gray-500 dark:text-gray-500">Manage the server firewall with ConfigServer Firewall.</p>
</div>

<iframe class="stream-element block w-full border-0" name="myiframe" id="myiframe" src="/configservercsf/iframe/" title="ConfigServer Firewall" style="height: calc(100svh - 4rem);"></iframe>

    </main>

    {{template "chrome_after_main" .}}
    </div>
</div>
{{template "chrome_scripts_bottom" .}}
</body>
</html>
