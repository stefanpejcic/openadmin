<div style="background:#f5f5f5;padding:1.5rem;border-radius:8px;">
  <div style="background:#fff;border:1px solid #eaeaea;border-radius:5px;margin:0 auto;max-width:600px;padding:40px;">
    <h1 style="color:#111;font-size:22px;font-weight:normal;">{{.Title}}</h1>
    <p style="color:#111;font-size:14px;line-height:24px;white-space:pre-wrap;">{{.Message}}</p>
    <hr style="border:none;border-top:1px solid #eaeaea;margin:26px 0;">
    <p style="color:#666;font-size:12px;">This email was sent by OpenPanel server: <strong>{{.Hostname}}</strong></p>
  </div>
</div>
