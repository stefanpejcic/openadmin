<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f9fafb;padding:1.5rem;border-radius:6px;">
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:6px;margin:0 auto;max-width:600px;padding:40px;">
    <h1 style="color:#111827;font-size:20px;font-weight:600;">{{.Title}}</h1>
    <p style="color:#111827;font-size:14px;line-height:24px;white-space:pre-wrap;">{{.Message}}</p>
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:26px 0;">
    <p style="color:#6b7280;font-size:12px;">This email was sent by OpenPanel server: <strong>{{.Hostname}}</strong></p>
  </div>
</div>
