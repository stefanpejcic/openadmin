<div style="background: var(--color-background-secondary); padding: 1.5rem; border-radius: var(--border-radius-lg);">
  <div style="background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; max-width: 600px; margin: 0 auto;">

    <div style="height: 5px; background: #de3618;"></div>

    <div style="padding: 32px 36px 24px;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #de3618; display: inline-block; flex-shrink: 0;"></span>
        <strong style="font-size: 17px; color: var(--color-text-primary);">{{ title }}</strong>
      </div>

      <p style="font-size: 15px; line-height: 1.7; color: var(--color-text-secondary); margin: 0;">
        Hello,<br><br>
        {{ message.split('\n', 1)[1].replace('\n', '&lt;br&gt;') | safe }}
      </p>
    </div>

    <div style="padding: 0 36px 28px;">
      <a href="{{ notifications_url }}" style="display: inline-block; font-size: 14px; font-weight: 500; color: var(--color-text-primary); border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 22px; text-decoration: none;">
        Edit Notification Preferences
      </a>
    </div>

    <div style="background: var(--color-background-secondary); padding: 16px 36px; display: flex; align-items: center; justify-content: space-between; border-top: 0.5px solid var(--color-border-tertiary);">
      <a href="https://openpanel.com?utm=user_email" target="_blank">
        <img src="https://openpanel.com/img/openpanel_logo.png" width="40" height="37" alt="OpenPanel" style="display: block;" />
      </a>
      <div style="font-size: 13px; color: var(--color-text-secondary);">
        <a href="{{ notifications_url }}" style="color: var(--color-text-secondary); text-decoration: none;">Help &amp; Support</a>
        <span style="margin: 0 6px; color: var(--color-border-secondary);">·</span>
        <a href="{{ notifications_url.rsplit('/account/notifications', 1)[0] + '/login' }}" style="color: var(--color-text-secondary); text-decoration: none;">Sign in</a>
      </div>
    </div>
  </div>

  <p style="text-align: center; font-size: 12px; color: var(--color-text-tertiary); margin: 14px auto 0; max-width: 600px;">
    You are receiving this notification due to your current notifications preferences. If you'd like to disable them, please
    <a href="{{ notifications_url }}" style="color: #067df7; text-decoration: none;">click here</a>.
  </p>
</div>
