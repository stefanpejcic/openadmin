{% macro tooltip(id, label, description, required=False) %}
<label class="flex justify-between pb-2 text-sm leading-none text-gray-900 dark:text-gray-50 font-medium flex items-center gap-1" for="{{ id }}" x-data="{tooltip: false}">
    <span>{{ label }}: {% if required %}<span class="text-red-500 dark:text-red-500">*</span>{% endif %}</span>
    <span @mouseenter="tooltip = true" @mouseleave="tooltip = false" class="relative cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-question-circle" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286m1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94"/>
        </svg>
        <div x-show="tooltip" x-transition class="absolute z-10 mt-2 w-64 rounded-lg bg-gray-800 text-white text-sm px-3 py-2 shadow-lg" style="top: 100%; left: 0;">{{ description }}
        </div>
    </span>
</label>
{% endmacro %}

{% macro domain_selector(domains, redirect_base, include_username=False) %}
    {% if domains %}
        {% if domains == -1 %}
            {% include 'system/_mysql_error.html' %}
        {% else %}
            <select id="domains" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" onchange="redirectToSelectedVersion(this, '{{ redirect_base }}')">
                <option value="" disabled selected>Select domain</option>
                {% for domain in domains %}
                    <option
                        value="{{ domain.domain_url }}" class="punycode" {% if include_username %}data-username="{{ domain.username }}"{% endif %}>
                        {{ domain.domain_url }}
                    </option>
                {% endfor %}
            </select>

            <script>
                function redirectToSelectedVersion(selectElement, baseUrl) {
                    const selectedOption = selectElement.options[selectElement.selectedIndex];
                    const domain = selectedOption.value;
                    const username = selectedOption.dataset.username;

                    if (domain) {
                        let url = baseUrl;

                        if (username) {
                            url += username + "/";
                        }

                        url += domain;
                        window.location.href = url;
                    }
                }
            </script>
        {% endif %}
    {% endif %}
{% endmacro %}
