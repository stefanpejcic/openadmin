{% extends 'base.html' %}
{% block content %}

<!-- page header -->
<section
    aria-label="Select Domain Log Header"
>
    <div class="border-b flex flex-col border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 sm:flex-row sm:items-center sm:justify-between gap-1">
        <div>
        <div class="flex items-center gap-x-3"><h1 class="text-lg font-semibold text-gray-900 dark:text-gray-50">GoAccess</h1></div>
        <p class="text-sm text-gray-500 dark:text-gray-500">View html reports generated from domain access logs.</p>
    </div>
    <div class="mt-2 gap-2 sm:mt-0 sm:flex">
    </div>
</div>
<!-- END page header -->

{% import "macros.html" as macros %}

<!-- form -->
<div class="sm:mx-auto sm:max-w-2xl p-6 m-6 CrawlerStatusCard" id="toAddActive">
    <form class="mt-8" method="GET">
        <div class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-6">
            <div class="col-span-full">
                {{ macros.domain_selector(domains, "/domains/stats/") }}
            </div>
        </div>
    </form>
</div>

</section>

{% endblock %}
