<!-- START templates/dashboard/openpanel_news.html -->
<style>.dismiss-custom_message-button { display: none;} #custom_message:hover .dismiss-custom_message-button { display: inline-block;}</style>

<div>
    <div id="custom_message" class="">
        <form action="{{ url_for('dismiss_dashboard_widget', template_name='openpanel_news') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flex flex-col gap-2 text-center sm:flex-row sm:items-center sm:justify-between sm:text-start pb-2"><div><h3 class="font-medium text-gray-900 dark:text-gray-50">Latest News <button class="dismiss-custom_message-button text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 rounded px-2 py-1 ml-2" type="submit" title="Hide and never show news from openpanel.com/blog again">Dismiss</button></h3><p class="text-sm/6 text-gray-500 dark:text-gray-500">from the OpenPanel blog.</p></div></div>
        </form>

        <div class="overflow-auto mt-2 h-full divide-y divide-gray-200 dark:divide-gray-800" id="news-content"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const newsContent = document.getElementById('news-content');
    const CACHE_KEY = "cachedNews";
    const CACHE_EXPIRY_KEY = "cachedNewsExpiry";
    const CACHE_DURATION = 1000 * 60 * 60 * 6; // 6 hours

    const loadFromCache = () => {
        const cached = localStorage.getItem(CACHE_KEY);
        const expiry = localStorage.getItem(CACHE_EXPIRY_KEY);
        if (cached && expiry && Date.now() < parseInt(expiry)) {
            return JSON.parse(cached);
        }
        return null;
    };

    const saveToCache = (data) => {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_EXPIRY_KEY, Date.now() + CACHE_DURATION);
    };

    const fetchRequiredLines = async (fileUrl) => {
        const response = await fetch(fileUrl);
        const text = await response.text();
        const lines = text.split('\n');
        const title = lines.find(line => line.startsWith('title:'))?.replace('title:', '').trim() || 'No Title';
        const description = lines.find(line => line.startsWith('description:'))?.replace('description:', '').trim() || '';
        const slug = lines.find(line => line.startsWith('slug:'))?.replace('slug:', '').trim() || '';
        const image = lines.find(line => line.startsWith('image:'))?.replace('image:', '').trim() || '';
        return { title, description, slug, image };
    };

    const fetchAndProcessData = async () => {
        const response = await fetch('https://api.github.com/repos/stefanpejcic/OpenPanel/contents/website/blog');
        const data = await response.json();

        const markdownFiles = data
            .filter(file => file.name.endsWith('.md') && !file.name.toLowerCase().includes('cpanel'))
            .sort((a, b) => new Date(b.name.split('-').slice(0, 3).join('-')) - new Date(a.name.split('-').slice(0, 3).join('-')))
            .slice(0, 7);


        const content = [];
        for (const file of markdownFiles) {
            const fileUrl = `https://raw.githubusercontent.com/stefanpejcic/OpenPanel/main/website/blog/${file.name}`;
            const info = await fetchRequiredLines(fileUrl);
            const dateStr = file.name.split('-').slice(0, 3).join('-');
            const formattedDate = new Date(dateStr).toLocaleDateString(undefined, {
                year: 'numeric', month: 'long'
            });
            content.push({ ...info, formattedDate });
        }

        saveToCache(content);
        return content;
    };

const renderNewsItems = (items) => {
    newsContent.innerHTML = '';
    items.forEach(({ title, description, slug, image, formattedDate }) => {
        const newsItemDiv = document.createElement('div');
        newsItemDiv.classList.add('flex', 'items-center', 'py-2');

        if (image) {
            const imageDiv = document.createElement('div');
            imageDiv.classList.add('w-1/4', 'pr-3');
            const imgLink = document.createElement('a');
            imgLink.href = `https://openpanel.com/blog/${slug}`;
            imgLink.target = '_blank';
            const img = document.createElement('img');
            img.src = image;
            img.alt = title;
            img.classList.add('rounded-lg', 'w-full');
            imgLink.appendChild(img);
            imageDiv.appendChild(imgLink);
            newsItemDiv.appendChild(imageDiv);
        }

        const contentDiv = document.createElement('div');
        contentDiv.classList.add('flex-1');

        const headerWrapper = document.createElement('div');
        headerWrapper.classList.add('flex', 'justify-between', 'space-x-4');

        const titleElement = document.createElement('h3');
        titleElement.classList.add('text-lg', 'font-semibold', 'leading-tight');
        const titleLink = document.createElement('a');
        titleLink.href = `https://openpanel.com/blog/${slug}`;
        titleLink.target = '_blank';
        titleLink.classList.add('text-sm', 'font-medium', 'text-gray-900', 'dark:text-gray-50', 'hover:underline');
        titleLink.textContent = title;
        titleElement.appendChild(titleLink);

        const dateElement = document.createElement('p');
        dateElement.classList.add('hidden', 'text-xs', 'text-gray-500', 'dark:text-gray-400');
        dateElement.textContent = formattedDate;

        headerWrapper.appendChild(titleElement);
        headerWrapper.appendChild(dateElement);

        const descriptionElement = document.createElement('p');
        descriptionElement.classList.add('text-xs', 'capitalize', 'text-gray-600', 'dark:text-gray-400');
        descriptionElement.textContent = description;

        contentDiv.appendChild(headerWrapper);
        contentDiv.appendChild(descriptionElement);
        newsItemDiv.appendChild(contentDiv);
        newsContent.appendChild(newsItemDiv);
    });
};



    const init = async () => {
        try {
            const cachedData = loadFromCache();
            if (cachedData) {
                renderNewsItems(cachedData);
            } else {
                const freshData = await fetchAndProcessData();
                renderNewsItems(freshData);
            }
        } catch (error) {
            console.error('Error loading news:', error);
            newsContent.innerHTML = '<p class="text-red-500">Error loading news</p>';
        }
    };

    init();
});
</script>
<!-- END templates/dashboard/openpanel_news.html -->
